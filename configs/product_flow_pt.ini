[data]
events_dir = /Users/wx/Desktop/benchmark/pt/pt-events
pbc_override = true,true,false
active_source = displacement
active_threshold = 0.2

[output]
output_dir = runs/pt_product_flow_config
log_to_stdout = false

[split]
train = 0.7
val = 0.15
test = 0.15
seed = 42

[model]
hidden_dim = 64
num_layers = 3
cutoff = 4.0

[init]
types = zero, gaussian
gaussian_scale = 0.05

[training]
epochs = 100
lr = 0.001
batch_size = 16

[runtime]
device = auto
cpu_threads = 8
gpu_ids = 0
gpu_count = 1

[evaluation]
eval_num_steps = 8
eval_graph_update_interval = 2
