[data]
train_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/train
val_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/val
test_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/test
active_threshold = 0.1

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official/transition1x_direction_rmax4_wd_9000
log_to_stdout = true

# Network size, cutoff and radial basis follow MolGEN's effective values
# (`mdgen/equivariant_wrapper.py:147,168`: 6 layers, 256 width, 96 radial,
# cutoff 12). BasinFlow keeps its own backbone; only the capacity matches.
[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
# 96 Bessel functions over 12 A is a 0.125 A spacing, and a 15-atom molecule is
# already fully connected at 6 A (both give 291 edges per molecule), so the
# cutoff only coarsens the distance encoding. At 4 A the spacing is 0.042 A and
# every bond-change edge is still inside the graph. A 128-event probe at equal
# optimisation: median 0.098 -> 0.080, mean 0.309 -> 0.174, L1 0.151 -> 0.124.
r_max = 4
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded
# Edge condition from docs/19 section 6: every edge carries a one-hot label
# {unchanged, formed, broken} derived from the reactant/product bond graphs.
bond_change_condition = true
# Completion of the condition: the discrete labels say which bonds change, and
# this adds an equivariant per-atom pull towards a forming bond and away from a
# breaking one. Without it the initial vector features are exactly zero at
# t = 0, because the current and reference geometries coincide there. On a fixed
# 128-event memorisation probe the same optimisation reaches 0.117 A aligned
# median with the labels alone and 0.092 A with the direction added.
bond_change_direction = true

# MolGEN draws t ~ Beta(0.8, 0.8) (`transport.py:265`, uniform is commented out).
[init]
types = gaussian
# scale = 0 makes the source geometry exactly the reactant, so the target is
# the clean displacement P - R. The 0.05 A seed adds an irreducible ~0.087 A
# per-atom RMS to the target and a memorisation probe showed it costs far more
# than that: on a fixed 64-event subset the same architecture reached 0.49 A
# aligned RMSD from a noise-free source but only 0.97 A from the noisy one.
# At t = 0 the seed is the input, so any noise in it is pure nuisance.
gaussian_scale = 0.0
time_distribution = beta
beta_alpha = 0.8
# Direct regression at t = 0. The interpolated position is (1-t)*x0 + t*x1, so
# with a near-copy prior every t > 0 lets the field recover the target by the
# algebraic inverse (x_t - x0)/t; the fitted field is then an inversion rather
# than a velocity field, and it carries no direction at t = 0 where sampling
# starts. Fixing t = 0 removes the leak: the input is the seed geometry and the
# only way to reduce the loss is to learn the actual map. See docs/22.
flow_time = 0.0

# MolGEN's 1e-4 is the *peak* of a warmup/cosine schedule, not a constant, and
# it was tuned for a different task. A memorisation probe on a fixed 64-event
# subset (same architecture, noise-free source, t = 0) shows the fit is
# optimisation-limited, not capacity-limited:
#   lr 1e-3, 120 epochs -> 0.492 A aligned RMSD median
#   lr 3e-3, 600 epochs -> 0.164 A
#   lr 3e-3, 900 epochs -> 0.138 A
# so the constant 1e-4 used for the first three arms leaves the model far from
# the accuracy the network can represent. 2e-3 is used here.
[training]
epochs = 80
max_grad_norm = 1.0
lr = 1.0e-3
# MolGEN anneals from its peak; a constant peak makes the L1 step noise
# visible. Warmup 5%, cosine decay to 5% of the peak.
scheduler = cosine
warmup_fraction = 0.05
min_lr_fraction = 0.05
batch_size = 64
optimizer = adamw
amsgrad = false
# The 240-epoch continuation kept lowering the *training* error
# (0.190 -> 0.144 aligned median) while the validation metric stood still
# (clip 0.5540 -> 0.5630), so extra fitting was not transferring. That is the
# signature of a widening generalisation gap, which is what weight decay
# targets. 1e-2 with AdamW at lr 1e-3 is the usual starting point.
weight_decay = 1.0e-2
validate_each_epoch = true
save_each_epoch = true
seed = 42

# MolGEN's default objective is L1 (`transport.py:392-393`).
[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 3

[evaluation]
eval_num_steps = 1
eval_graph_update_interval = 1
trials_per_basin = 16
sampling_seed = 20260910
selection_seed = 20260910
split = val
# Oracle arm: the sampler receives the recorded topology change. This measures
# the ceiling of the bond-change condition and is a labelled diagnostic, not a
# deployable basin-level proposal.
bond_change_source = oracle
