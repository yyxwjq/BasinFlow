# ReactOT reproduction: LEFTNet + Schrodinger bridge on the official rpsb data.
#
# Reference recipe (react-ot/reactot/trainer/train_rpsb_ts1x.py):
#   model      LEFTNet, cutoff 10, 6 layers, 196 channels, 96 radial, object_aware
#   task       mapping R+P->TS, mapping_initial RP, sigma 0, ot_ode True
#   optimizer  AdamW lr 1e-4, betas (0.9, 0.999), weight_decay 0, amsgrad True
#   budget     max_epochs 3000 with limit_train_batches 200 -> 600000 steps
#   batch      bz 14 (dynamic node^2 sampler, max_num 2800, see below)
#   EMA        ema True, ema_decay 0.999, and the reported numbers use the EMA
#   schedule   timesteps 3000, beta_max 0.3, power 0.5, inv_power 1
#   sampling   solver "ode", method "midpoint", nfe 10, atol/rtol 1e-2
#
# Deliberate differences from the reference, each recorded so the numbers are
# never presented as bitwise-equivalent:
#
# 1. `max_grad_norm = 1.0` is fixed. ReactOT clips adaptively at
#    `1.5 * mean + 3 * std` of a rolling gradient-norm queue seeded with 3000
#    (pl_trainer.py:455-485). A fixed clip is what the project plan specifies.
# 2. `norm = mse` corresponds to the reference's `loss_type = "l2"`; this repo
#    spells the L2 objective `mse` (the alternative here is `l1`).
# 3. `eval_num_steps = 11` matches the reference's `nfe = 10`: torchdiffeq is
#    given `nfe + 1` saved points on the output grid.
# 4. `trials_per_event = 1`: the bridge is deterministic (sigma = 0), so extra
#    trials would only repeat the same trajectory.
# 5. Batching is a fixed `batch_size = 14`. ReactOT uses a dynamic `node^2`
#    sampler (`max_num = 2800`, dataset/sampler.py:105); for the Transition1x
#    molecule sizes (4-23 atoms) a fixed 14 keeps the padded node count in the
#    same range without a new sampler implementation.
[data]
events_dir = /Users/wx/Desktop/benchmark/0910/data/reactot_transition1x_bridge/events
auto_split = false

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official_reactot/leftnet_sb
log_to_stdout = true

[model]
backend = leftnet_sb
num_features = 196
num_layers = 6
num_radial = 96
cutoff = 10.0
num_elements = 5
reflect_equiv = true
legacy = true
update = true
single_layer_output = true
object_aware = true

[bridge]
timesteps = 3000
beta_max = 0.3
power = 0.5
inv_power = 1

[training]
epochs = 3000
max_steps = 600000
lr = 1.0e-4
batch_size = 14
optimizer = adamw
amsgrad = true
weight_decay = 0.0
max_grad_norm = 1.0
scheduler = constant
warmup_fraction = 0.0
min_lr_fraction = 0.0
validate_each_epoch = false
save_each_epoch = true
seed = 42
ema_decay = 0.999

[loss]
velocity_weight = 1.0
norm = mse

[runtime]
device = cuda
cpu_threads = 1

[evaluation]
eval_num_steps = 11
trials_per_event = 1
sampling_seed = 20260910
split = test
integrator = midpoint
solver_atol = 1.0e-2
solver_rtol = 1.0e-2
