# R + P -> transition state on Transition1x, the task ReactOT and MolGEN
# report. Both endpoints are conditioning inputs, the source geometry is the
# midpoint bridge (R + P)/2, and the target is the recorded transition state.
# This config is the equivariant-endpoint arm: the product edge directions
# enter the vector message, not just the scalar filter.
[data]
train_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000_ts/train
val_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000_ts/val
test_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000_ts/test

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official/transition1x_ts_invariant_aligned
log_to_stdout = true

[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
r_max = 12
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded
endpoint_condition = true
endpoint_equivariant = false

[init]
flow_time = 0.0
source_scale = 0.0

[training]
epochs = 60
max_grad_norm = 1.0
lr = 1.0e-3
scheduler = cosine
warmup_fraction = 0.05
min_lr_fraction = 0.05
batch_size = 64
optimizer = adamw
amsgrad = false
weight_decay = 0.0
validate_each_epoch = false
save_each_epoch = true
seed = 42

[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 3

[evaluation]
eval_num_steps = 1
trials_per_basin = 1
sampling_seed = 20260910
split = val
