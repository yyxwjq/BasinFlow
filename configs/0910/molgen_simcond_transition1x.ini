[data]
train_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/train
val_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/val
test_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/test
active_threshold = 0.1

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official/transition1x_molgen_simcond_9000
log_to_stdout = true

# Network size, cutoff and radial basis follow MolGEN's effective values
# (`mdgen/equivariant_wrapper.py:147,168`: 6 layers, 256 width, 96 radial,
# cutoff 12). BasinFlow keeps its own backbone; only the capacity matches.
[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
r_max = 12
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded
# MolGEN's `--sim_condition` mode: only `cond_f` (frame 0 = reactant) is given,
# the loss and the generated frame are the last one (frame 2 = product), and no
# product-derived information of any kind is supplied. This is MolGEN's R -> P
# recipe, which the earlier arms had not run: the x0std1 arm added our
# bond-change condition and the molgen_style arm used the wrong prior scale.
bond_change_condition = false

# MolGEN draws t ~ Beta(0.8, 0.8) (`transport.py:265`, uniform is commented out).
[init]
types = gaussian
# MolGEN's prior is `torch.randn_like(x1) * x0std` with `x0std = 1.0`
# (`mdgen/transport/transport.py:262`, `mdgen/parsing.py:83`). The 0.05 A prior
# used earlier makes x0 a near-copy of the reactant, which lets the model read
# the answer off x_t for every t > 0 and leaves the sampler with nothing at
# t = 0. Matching the reference scale makes every t a genuine denoising step.
gaussian_scale = 1.0
time_distribution = beta
beta_alpha = 0.8

# MolGEN trains with AdamW, grad clip 1.0 (`parsing.py:38`) and lr 1e-4 as the
# peak of its warmup/cosine schedule (`wrapper.py:175`). BasinFlow has no
# scheduler, so the peak value is used as a constant.
[training]
epochs = 80
max_grad_norm = 1.0
lr = 1.0e-4
batch_size = 64
optimizer = adamw
amsgrad = false
weight_decay = 0.0
validate_each_epoch = true
save_each_epoch = true
seed = 42

# MolGEN's default objective is L1 (`transport.py:392-393`).
[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 4

[evaluation]
eval_num_steps = 50
eval_graph_update_interval = 1
trials_per_basin = 16
sampling_seed = 20260910
selection_seed = 20260910
split = val
# Oracle arm: the sampler receives the recorded topology change. This measures
# the ceiling of the bond-change condition and is a labelled diagnostic, not a
# deployable basin-level proposal.
bond_change_source = oracle
