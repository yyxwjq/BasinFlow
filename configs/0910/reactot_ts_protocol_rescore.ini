# Rescore an existing R+P -> TS checkpoint under the migrated data contract and
# the dual (strict + ReactOT reference) RMSD protocol.
#
# Why this file exists: the historical `transition1x_ts_*` run directories still
# carry the pre-rewrite config keys (train/val/test_events_dir, active_weight,
# trials_per_basin, ...) and the rewritten `read_config` correctly refuses them.
# Rather than edit a finished run in place, this config points at the *same*
# aligned 9000/536/537 dataset in its canonical merged layout
# (`events/` + `split.csv`, produced by tools/migrate_split_manifest.py) and at
# the same PaiNN architecture the checkpoint was trained with, so
# `tools/evaluate_transition_state.py --config <this file>` can rescore that
# checkpoint without touching the original run.
#
# Solver note: the historical ts_curve was produced under the old fixed-step
# semantics. This rescore uses the current dopri5 default on a 50-point output
# grid, so absolute values are not comparable with the old curve; the
# strict-versus-reference *delta* on identical candidates is the transferable
# quantity.
[data]
events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000_ts_merged/events
auto_split = false

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official_reactot/protocol_rescore
log_to_stdout = true

[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
r_max = 12
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded
endpoint_condition = true
endpoint_equivariant = true

[init]
flow_time = 0.0
source_scale = 0.0

[training]
epochs = 1
lr = 1.0e-3
batch_size = 64
seed = 42
validate_each_epoch = false
save_each_epoch = false

[loss]
velocity_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 1

[evaluation]
eval_num_steps = 50
trials_per_event = 1
sampling_seed = 20260910
split = val
