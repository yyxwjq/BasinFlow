# R + P -> transition state as a *flow*, MolGEN-style source and time law.
#
# The previous TS arms pinned `flow_time = 0.0` with `source_scale = 0.0`, so
# every training sample was the midpoint bridge at t = 0 and the network only
# ever fit `TS - (R+P)/2` as a function of the endpoints. That is direct
# regression: the field is supervised at a single time, and one sampler step is
# the whole model. This arm restores both missing pieces:
#
#   source x0 = (R+P)/2 + sigma * xi      (MolGEN: randn_like(x1) * x0std)
#   time    t ~ Beta(0.8, 0.8)            (MolGEN: transport.py:265)
#   x_t     = (1 - t) * x0 + t * TS
#   v       = TS - x0                     (constant-velocity conditional path)
#
# sigma is MolGEN's x0std = 1.0 A so that x_t never carries the answer
# algebraically; see docs/22 for why a near-copy source makes every t > 0 an
# inverse rather than a transport step.
[data]
train_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/train
val_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/val
test_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_9000/test

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official/transition1x_ts_flowmolgen_probe
log_to_stdout = true

[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
r_max = 12
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded
endpoint_condition = true
endpoint_equivariant = true

[init]
# No flow_time: a pinned time is rejected together with a sampled distribution.
source_scale = 1.0
time_distribution = beta
beta_alpha = 0.8

[training]
epochs = 10
max_grad_norm = 1.0
lr = 1.0e-3
scheduler = cosine
warmup_fraction = 0.05
min_lr_fraction = 0.05
batch_size = 64
optimizer = adamw
amsgrad = false
weight_decay = 0.0
validate_each_epoch = false
save_each_epoch = true
seed = 42

[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 4

[evaluation]
# The probe integrates the learned field instead of taking one Euler step; the
# step count is reported so the two regimes stay distinguishable.
eval_num_steps = 16
trials_per_basin = 1
sampling_seed = 20260910
split = val
