[data]
train_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_single_fragment/train
val_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_single_fragment/val
test_events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_aligned_single_fragment/test
active_threshold = 0.1

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/official/transition1x_molgen_style
log_to_stdout = true

# Network size, cutoff and radial basis follow MolGEN's effective values
# (`mdgen/equivariant_wrapper.py:147,168`: 6 layers, 256 width, 96 radial,
# cutoff 12). BasinFlow keeps its own backbone; only the capacity matches.
[model]
backend = painn
num_features = 256
num_layers = 6
num_radial_basis = 96
r_max = 12
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = bounded

# MolGEN draws t ~ Beta(0.8, 0.8) (`transport.py:265`, uniform is commented out).
[init]
types = gaussian
gaussian_scale = 0.05
time_distribution = beta
beta_alpha = 0.8

# MolGEN trains with AdamW, grad clip 1.0 (`parsing.py:38`) and lr 1e-4 as the
# peak of its warmup/cosine schedule (`wrapper.py:175`). BasinFlow has no
# scheduler, so the peak value is used as a constant.
[training]
epochs = 80
max_grad_norm = 1.0
lr = 1.0e-4
batch_size = 64
optimizer = adamw
amsgrad = false
weight_decay = 0.0
validate_each_epoch = true
save_each_epoch = true
seed = 42

# MolGEN's default objective is L1 (`transport.py:392-393`).
[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0
norm = l1

[runtime]
device = cpu
cpu_threads = 8

[evaluation]
eval_num_steps = 16
eval_graph_update_interval = 1
trials_per_basin = 16
sampling_seed = 20260910
selection_seed = 20260910
split = val
