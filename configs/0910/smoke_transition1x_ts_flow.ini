# Smoke arm for R+P -> TS *flow* degeneracy checks (sampled source, sampled t).
# Mirrors configs/0910/smoke_transition1x.ini but for the TS workflow, so the
# "is this actually a flow" contract can be exercised end to end in seconds.
[data]
events_dir = /Users/wx/Desktop/benchmark/0910/data/transition1x_single_fragment/events
active_threshold = 0.1

[output]
output_dir = /Users/wx/Desktop/benchmark/0910/smoke/transition1x_ts_flow
log_to_stdout = true

[split]
train = 0.7
val = 0.15
test = 0.15
seed = 42
manifest = /Users/wx/Desktop/benchmark/0910/data/transition1x_single_fragment/split_manifest.json

[model]
backend = painn
num_features = 32
num_layers = 2
num_radial_basis = 32
r_max = 5
num_elements = 119
time_dim = 32
radial_basis = bessel
envelope = polynomial
stability_mode = none
endpoint_condition = true
endpoint_equivariant = true

[init]
source_scale = 1.0
time_distribution = beta
beta_alpha = 0.8

[training]
epochs = 1000
max_steps = 2
max_grad_norm = 10.0
lr = 0.001
batch_size = 32

[loss]
velocity_weight = 1.0
active_weight = 0.0
direction_weight = 0.0
active_pos_weight = 1.0

[runtime]
device = cpu
cpu_threads = 4

[evaluation]
eval_num_steps = 4
trials_per_basin = 2
sampling_seed = 20260910
split = val
num_events = 2
