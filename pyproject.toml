[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fscgp"
version = "0.1.0"
description = "Geometry and data core for BasinFlow event proposal workflows"
requires-python = ">=3.10"
dependencies = [
  "ase",
  "numpy",
]

[project.optional-dependencies]
models = [
  "scipy",
  "torch",
  "torch-geometric",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
